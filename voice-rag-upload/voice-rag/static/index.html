<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 암묵지 어시스턴트 · 신입 모드</title>
<style>
  :root { --ink:#16232E; --sub:#5C6B78; --accent:#E8590C; --teal:#0B7285; --line:#DDE3E8; }
  * { box-sizing:border-box; }
  body { margin:0; background:#F1F3F5; color:var(--ink); font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .shell { max-width:720px; margin:0 auto; padding:0 16px 140px; }
  header { display:flex; justify-content:space-between; align-items:baseline; padding:28px 4px 18px; border-bottom:2px solid var(--ink); }
  h1 { font-size:20px; margin:0; letter-spacing:-0.02em; } h1 em { color:var(--accent); font-style:normal; }
  .sub { font-size:11px; color:var(--sub); letter-spacing:.08em; text-transform:uppercase; }
  .q { width:fit-content; max-width:85%; margin:18px 0 0 auto; background:var(--ink); color:#fff; padding:10px 14px; border-radius:12px 12px 2px 12px; font-size:15px; }
  .cards { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .card .top { display:flex; justify-content:space-between; font-size:11px; color:var(--sub); }
  .card .top .score { color:var(--teal); font-weight:700; }
  .card .insight { font-size:13px; margin-top:5px; line-height:1.5; }
  .answer { background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:14px 16px; margin-top:10px; font-size:15px; line-height:1.65; white-space:pre-wrap; }
  .label { font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--sub); margin-top:12px; text-transform:uppercase; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:rgba(241,243,245,.92); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:14px 16px 20px; }
  .row { max-width:720px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  #mic { width:54px; height:54px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:22px; cursor:pointer; flex-shrink:0; }
  #mic.on { background:#C92A2A; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(201,42,42,.5)} 50%{box-shadow:0 0 0 14px rgba(201,42,42,0)} }
  #text { flex:1; border:1px solid #CBD3DA; border-radius:999px; padding:13px 18px; font-size:15px; outline:none; }
  #send { border:none; background:var(--ink); color:#fff; border-radius:999px; padding:13px 20px; font-weight:700; cursor:pointer; }
  .replay { margin-top:10px; font-size:12px; font-weight:700; color:var(--teal); background:none; border:1px solid var(--teal); border-radius:999px; padding:5px 14px; cursor:pointer; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>현장 암묵지 어시스턴트 <em>· 신입 모드</em></h1>
      <div class="sub mono">Voice RAG · STT → Vector Search → LLM → TTS</div>
    </div>
  </header>
  <div id="feed"></div>
</div>
<div class="bar">
  <div class="row">
    <button id="mic" title="음성으로 질문">🎤</button>
    <input id="text" placeholder="또는 텍스트로 질문 입력">
    <button id="send">질문</button>
  </div>
</div>
<script>
const feed = document.getElementById('feed');

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/출처:.*$/s, ''));
  u.lang = 'ko-KR'; u.rate = 1.05;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('ko'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function ask(question) {
  if (!question.trim()) return;
  document.getElementById('text').value = '';
  const block = document.createElement('div');
  block.innerHTML = `<div class="q"></div><div class="answer" style="color:#5C6B78">검색 및 답변 생성 중…</div>`;
  block.querySelector('.q').textContent = question;
  feed.appendChild(block);
  block.scrollIntoView({behavior:'smooth'});

  const res = await fetch('/ask', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question})
  });
  const data = await res.json();

  let html = '';
  if (data.sources.length) {
    html += `<div class="label">검색된 암묵지 Top ${data.sources.length}</div><div class="cards">`;
    for (const s of data.sources) {
      html += `<div class="card">
        <div class="top"><span class="mono">${s.id}</span><span class="score mono">유사도 ${s.similarity}</span></div>
        <div class="insight"></div>
        <div class="top mono" style="margin-top:5px"><span>${s.video}</span><span>${s.clip}</span></div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `<div class="answer"></div>`;
  block.innerHTML = `<div class="q"></div>` + html;
  block.querySelector('.q').textContent = question;
  const insights = block.querySelectorAll('.insight');
  data.sources.forEach((s,i) => insights[i].textContent = s.insight);
  const ansEl = block.querySelector('.answer');
  ansEl.textContent = data.answer;
  const btn = document.createElement('div');
  btn.innerHTML = `<button class="replay">🔊 다시 듣기</button>`;
  btn.querySelector('button').onclick = () => speak(data.answer);
  ansEl.appendChild(btn);
  speak(data.answer);
  block.scrollIntoView({behavior:'smooth', block:'end'});
}

// STT (Web Speech API, Chrome 권장)
const micBtn = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
micBtn.onclick = () => {
  if (!SR) { alert('이 브라우저는 음성 인식을 지원하지 않아요. Chrome을 사용하거나 텍스트로 입력하세요.'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = 'ko-KR';
  rec.onstart = () => micBtn.classList.add('on');
  rec.onend = () => { micBtn.classList.remove('on'); rec = null; };
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.start();
};

document.getElementById('send').onclick = () => ask(document.getElementById('text').value);
document.getElementById('text').addEventListener('keydown', e => { if (e.key === 'Enter') ask(e.target.value); });
</script>
</body>
</html>
