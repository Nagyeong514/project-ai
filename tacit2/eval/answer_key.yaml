# 암묵지 정답지 (평가 전용 — ★ 이 파일 내용을 프롬프트에 넣지 말 것: 정답 leak)
# match: any_of 의 키워드 그룹 중 하나라도, 그룹 안 키워드가 '전부' 후보 텍스트에 있으면 회수로 판정.
# silent: true = 발화 없는 침묵 암묵지 → VLM 관찰(action_only)로만 잡혀야 하는 고난도 항목.
#
# 2026-07-08 갱신: 정정본 정답지(9건→8건) 반영 + S1 항목 들여쓰기 버그 수정(원래 이 파일은
# S1 indentation이 깨져 YAML 파싱 자체가 실패했었다 — 아래 special 섹션으로 분리해 고쳤다).
# 변경 내역은 파이프라인_통합실행/run_logs/answer_key_fixed.yaml 상단 주석 참고(동일 내용).

items:
  - id: A1
    clip: CLIP1
    desc: "슬롯 라벨과 색상으로 채널 구성을 먼저 파악한 뒤 삽입 (00:25~01:15, 침묵)"
    silent: true
    any_of: [["채널", "색"], ["슬롯", "라벨"], ["슬롯", "색"]]

  - id: A2
    clip: CLIP1
    desc: "POWER2(GPU전원) 커넥터를 끼운 직후 손으로 눌러 촉각 재확인 (01:45~02:40, 침묵)"
    silent: true
    any_of: [["커넥터", "눌러"], ["커넥터", "손"], ["전원", "눌러"], ["촉각"]]

  - id: A3
    clip: CLIP2
    desc: "LED 깜빡임 패턴을 끝까지 읽고 원인을 RAM/CPU 계통으로 즉시 좁힌다 (00:00~00:29)"
    any_of: [["황색", "백색"], ["LED", "RAM"], ["깜빡", "패턴"], ["점멸", "패턴"]]

  - id: A4
    clip: CLIP2
    desc: "특정 부품을 의심하기 전 연결 상태 전체를 체계적으로 먼저 점검한다 (00:30~01:07)"
    any_of: [["연결", "전체"], ["원인", "좁히"], ["당겨"], ["연결", "먼저"]]

  - id: A5
    clip: CLIP2
    desc: "RAM 탈거 시 래치 양쪽을 동시에 눌러야 한다 — 한쪽만 누르면 슬롯 파손 (01:29~01:53)"
    any_of: [["양쪽", "동시"], ["동시", "눌러"], ["슬롯", "파손"]]

  - id: A6
    clip: CLIP3
    desc: "새 부품이라도 단자 산화막 세척이 교체보다 우선이다 (00:05~01:11)"
    any_of: [["산화"], ["닦"], ["세척", "단자"], ["세척", "먼저"]]

  - id: A7
    clip: CLIP3
    desc: "래치 잠금을 클릭 소리 2회(청각)+당겨보기(촉각)로 이중 확인한다 (01:25~01:50)"
    any_of: [["클릭", "두"], ["클릭", "2"], ["클립", "두"], ["소리", "두 번"], ["통전"]]

  - id: A8
    clip: CLIP4
    desc: "부팅 성공으로 끝내지 않고 BIOS 용량·채널 수치를 최종 확인한다 (01:10~02:55)"
    any_of: [["BIOS", "용량"], ["용량", "채널"], ["채널", "성능"], ["바이오스", "용량"]]

special:
  - id: S1
    clip: CLIP2
    desc: "발화 확정: '황색 4번에 백색 5번이면은 RAM이 불량이네요' (진단표엔 없는 패턴,
          해석은 발화 자체에 있으므로 reasoning_origin=utterance 가 정답).
          conflict=true 는 VLM 관찰에 LED 횟수가 '있고' 그 값이 4/5와 다를 때만 기대.
          단 0.5fps 프레임으로는 깜빡임 횟수 관찰이 사실상 불가하므로,
          VLM 관찰에 LED 횟수가 없으면 conflict=false 가 정상이다."
    check: conflict_true
