# tacit2/eval/answer_key.yaml 의 채점용 사본.
# 2026-07-08 갱신: 정정본 정답지(9건→8건) 반영. 변경 내역:
#   1) 구 A8("슬롯 색상·라벨로 채널 구성 즉시 파악, 6채널 워크스테이션 지식", CLIP3)을 제거.
#      (참고: 실측으로 확인해보니 "6개 슬롯/색상 구분" 발화는 실제로는 CLIP2 STT에 있었다 —
#      "램은 슬롯이 총 6개로 구분되어 있는데 색상으로 쉽게 구분을 할 수가 있습니다"
#      [80.5s~89.9s, CLIP2]. 구 A8이 CLIP3로 스코프돼 있어 원천적으로 회수 불가능했던
#      것으로 보인다. 어차피 이번에 항목 자체가 제거되어 더 이상 문제되지 않는다.)
#   2) 나머지 8건은 참조 발화를 패러프레이즈에서 영상 원본 대사로 교체, 타임스탬프도 일부 갱신.
#      any_of 키워드 그룹은 새 원본 대사 기준으로 재검증했다(아래 각 항목 주석 참고) —
#      실제 STT 출력 표기가 정답지 표의 문장과 다른 경우가 있어(예: 신 A8 desc의 "채널
#      오인식" ↔ 실제 STT는 "채널 5인식"으로 오기재) desc 문구를 그대로 키워드로 쓰지 않고,
#      실제 transcript에 존재하는 표기만 채택했다. 검증 결과 기존 any_of 그룹이 전부 새
#      원본 대사에서도 그대로 매칭되어 키워드 자체는 바꾸지 않았다(구 A1~A7,A9 → 신 A1~A8).
#   3) id는 구 A9만 A8로 당겨졌고 나머지는 번호 유지.
# ★ 평가 전용 — 프롬프트 주입 금지.

items:
  - id: A1
    clip: CLIP1
    desc: "슬롯 라벨과 색상으로 채널 구성을 먼저 파악한 뒤 삽입 (00:25~01:15, 침묵)"
    silent: true
    any_of: [["채널", "색"], ["슬롯", "라벨"], ["슬롯", "색"]]

  - id: A2
    clip: CLIP1
    desc: "POWER2(GPU전원) 커넥터를 끼운 직후 손으로 눌러 촉각 재확인 (01:45~02:40, 침묵)"
    silent: true
    any_of: [["커넥터", "눌러"], ["커넥터", "손"], ["전원", "눌러"], ["촉각"]]

  - id: A3
    clip: CLIP2
    desc: "LED 깜빡임 패턴을 끝까지 읽고 원인을 RAM/CPU 계통으로 즉시 좁힌다 (00:00~00:29)"
    # 실제 STT[24.3-44.6s]: "황색 4번에 백색 5번이면은 램 불량이네요 원인을 좁히기 전에…"
    # "황색"+"백색" 원문 그대로 존재 확인(2026-07-08).
    any_of: [["황색", "백색"], ["LED", "RAM"], ["깜빡", "패턴"], ["점멸", "패턴"]]

  - id: A4
    clip: CLIP2
    desc: "특정 부품을 의심하기 전 연결 상태 전체를 체계적으로 먼저 점검한다 (00:30~01:07)"
    # 실제 STT[24.3-44.6s]: "…원인을 좁히기 전에 일단 연결 상태부터 전체 확인을 해야합니다"
    # + [44.6-80.5s]: "이렇게 손으로 직접 당겨 보면은…". "연결"+"전체", "원인"+"좁히", "당겨" 확인.
    any_of: [["연결", "전체"], ["원인", "좁히"], ["당겨"], ["연결", "먼저"]]

  - id: A5
    clip: CLIP2
    desc: "RAM 탈거 시 래치 양쪽을 동시에 눌러야 한다 — 한쪽만 누르면 슬롯 파손 (01:29~01:53)"
    # 실제 STT[89.9-95.3s]: "램을 뺄때는 양쪽을 동시에 눌러 줘야 합니다"
    # + [95.3-100.0s]: "안그러면은 슬롯이 파손될 수가 있습니다". 그대로 확인.
    any_of: [["양쪽", "동시"], ["동시", "눌러"], ["슬롯", "파손"]]

  - id: A6
    clip: CLIP3
    desc: "새 부품이라도 단자 산화막 세척이 교체보다 우선이다 (00:05~01:11)"
    # 실제 STT[61.8-64.8s]: "깨끗해 보여도 이렇게 한 번씩 닦아줘야 합니다"
    # + [65.6-68.0s]: "산화막이 접촉 불량을 만들 수가 있습니다". "산화"/"닦" 그대로 확인.
    any_of: [["산화"], ["닦"], ["세척", "단자"], ["세척", "먼저"]]

  - id: A7
    clip: CLIP3
    desc: "래치 잠금을 클릭 소리 2회(청각)+당겨보기(촉각)로 이중 확인한다 (01:25~01:50)"
    # 실제 STT[94.9-97.5s]: "클릭 소리가 두 번이나게 끼워야 합니다"
    # + [97.8-99.6s]: "안 그러면 통전이 되지 않습니다". "클릭"+"두", "통전" 그대로 확인.
    any_of: [["클릭", "두"], ["클릭", "2"], ["클립", "두"], ["소리", "두 번"], ["통전"]]

  - id: A8
    clip: CLIP4
    desc: "부팅 성공으로 끝내지 않고 BIOS 용량·채널 수치를 최종 확인한다 (01:10~02:55)"
    # 실제 STT[127.4-130.0s]: "여기서 용량이 맞게 잡혔는지 봐야 해요"
    # + [130.7-134.8s]: "화면이 켜졌어도 채널 5인식이면 성능이 절반으로 날아가거든요"
    #   (★ "채널 오인식"이 아니라 STT 표기는 "채널 5인식" — desc 문구를 키워드로 안 씀)
    # + [170.1-172.0s]: "용량 맞고 채널 정상입니다" — "용량"+"채널" 조합이 원문 그대로 존재.
    any_of: [["BIOS", "용량"], ["용량", "채널"], ["채널", "성능"], ["바이오스", "용량"]]

special:
  - id: S1
    clip: CLIP2
    desc: "발화 확정: '황색 4번에 백색 5번이면은 RAM이 불량이네요' (진단표엔 없는 패턴,
          해석은 발화 자체에 있으므로 reasoning_origin=utterance 가 정답).
          conflict=true 는 VLM 관찰에 LED 횟수가 '있고' 그 값이 4/5와 다를 때만 기대.
          단 0.5fps 프레임으로는 깜빡임 횟수 관찰이 사실상 불가하므로,
          VLM 관찰에 LED 횟수가 없으면 conflict=false 가 정상이다."
    check: conflict_true
