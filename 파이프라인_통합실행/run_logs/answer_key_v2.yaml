# 암묵지 정답지 v2 (2026-07-09 개정, 사용자 승인) — 채점 전용, 프롬프트 주입 금지.
#
# 개정 원칙: GT는 파이프라인 입력(STT 발화 + VLM 관찰 원문)에서 도달 가능한 서술이어야
# 한다. 후보 출력은 참조하지 않고 원자료만 대조해 개정했다(대조 전문: 2026-07-09 세션,
# 구간별 STT/VLM 원문 추출 기준). 구판은 answer_key_fixed.yaml 보존 — 전/후 이중 채점용.
#
# 항목별 개정 사유(원자료 대조 결과):
#   A1: silent:true 삭제 — 구간 내 지식 발화 실재("이 슬롯에 먼저 꽂으면 됩니다"@00:48,
#       "색상으로 채널이 나뉘어져 있어요"@00:51). "라벨"은 발화·VLM 모두 부재 → 삭제.
#   A2: 구판 "커넥터를 끼운 직후 손으로 눌러 촉각 재확인(침묵)"은 도달 불가 —
#       구간 VLM 13건 전부 제거·당김 동작(장착·촉각확인 관찰 0건), "촉각" 단어 부재.
#       발화 근거 실지식으로 교체: "전원 커넥터 순서가 있어요"@01:47,
#       "24핀 메인 먼저 GPU 전원"@01:50.
#   A3: "CPU 계통" 삭제(발화는 램만: "램 불량이네요"), "끝까지"·"즉시" 삭제(근거 없음).
#       any_of에서 원자료 부재 단어(LED/점멸/깜빡/패턴) 그룹 제거, 발화 실재 조합으로 대체.
#   A5: "래치"→"클립"(발화 "양쪽", VLM "클립" — '래치'는 원자료 부재. any_of는 기존 유지,
#       ["클립","두"]는 A7 소관이라 무관).
#   A7: "당겨보기(촉각)·이중" 삭제 — 구간 VLM '당김'은 전부 클립을 여는 조작, 체결 후
#       확인용 당김 관찰 0건(클립 전체 재확인 완료). 청각 확인으로 축소.
#   A4·A6·A8: 무수정(원자료 완전 일치).
#
# ★ 침묵(silent) 항목: v2에서 0건 — 구판의 침묵 2건(A1·A2)이 모두 원자료 대조로
#   발화 근거 항목으로 재분류/교체됨. (승인문의 "자연히 1건" 예상과 다름 — A1 해제 +
#   A2 교체(발화 근거)를 둘 다 적용하면 침묵 분모는 0이 된다. 침묵 회수 지표는 v2에서
#   측정 불가이며, 필요 시 별도 침묵 GT 신설이 안건.)

items:
  - id: A1
    clip: CLIP1
    desc: "색상으로 채널 구성을 파악해 지정 슬롯에 먼저 꽂는다 (00:25~01:15)"
    # 실제 STT[48.4s] "이 슬롯에 먼저 꽂으면 됩니다" / [51.0s] "색상으로 채널이 나뉘어져 있어요"
    any_of: [["채널", "색"], ["슬롯", "색"], ["슬롯", "먼저"]]

  - id: A2
    clip: CLIP1
    desc: "전원 커넥터는 연결 순서가 있다 — 24핀 메인을 먼저, 그다음 GPU 전원 (01:45~02:40)"
    # 실제 STT[107s] "전원 커넥터 순서가 있어요" / [110s] "24핀 메인 먼저 GPU 전원"
    any_of: [["커넥터", "순서"], ["24핀"], ["전원", "순서"]]

  - id: A3
    clip: CLIP2
    desc: "깜빡임 패턴(황색 4·백색 5)을 읽고 원인을 RAM 계통으로 좁힌다 (00:00~00:29)"
    # 실제 STT[24.3s] "황색 4번에 백색 5번이면은 램 불량이네요 원인을 좁히기 전에…"
    any_of: [["황색", "백색"], ["램", "불량"], ["RAM", "불량"]]

  - id: A4
    clip: CLIP2
    desc: "특정 부품을 의심하기 전 연결 상태 전체를 체계적으로 먼저 점검한다 (00:30~01:07)"
    any_of: [["연결", "전체"], ["원인", "좁히"], ["당겨"], ["연결", "먼저"]]

  - id: A5
    clip: CLIP2
    desc: "RAM 탈거 시 클립 양쪽을 동시에 눌러야 한다 — 한쪽만 누르면 슬롯 파손 (01:29~01:53)"
    # 실제 STT[89.9s] "램을 뺄때는 양쪽을 동시에 눌러 줘야 합니다" / [95.3s] "안그러면은 슬롯이 파손될 수가 있습니다"
    any_of: [["양쪽", "동시"], ["동시", "눌러"], ["슬롯", "파손"]]

  - id: A6
    clip: CLIP3
    desc: "새 부품이라도 단자 산화막 세척이 교체보다 우선이다 (00:05~01:11)"
    any_of: [["산화"], ["닦"], ["세척", "단자"], ["세척", "먼저"]]

  - id: A7
    clip: CLIP3
    desc: "클립 체결을 클릭 소리 2회로 확인한다 — 안 그러면 통전되지 않는다 (01:25~01:50)"
    # 실제 STT[94.9s] "클릭 소리가 두 번이나게 끼워야 합니다" / [97.8s] "안 그러면 통전이 되지 않습니다"
    any_of: [["클릭", "두"], ["클릭", "2"], ["클립", "두"], ["소리", "두 번"], ["통전"]]

  - id: A8
    clip: CLIP4
    desc: "부팅 성공으로 끝내지 않고 BIOS 용량·채널 수치를 최종 확인한다 (01:10~02:55)"
    any_of: [["BIOS", "용량"], ["용량", "채널"], ["채널", "성능"], ["바이오스", "용량"]]

special:
  - id: S1
    clip: CLIP2
    desc: "발화 확정: '황색 4번에 백색 5번이면은 RAM이 불량이네요' (진단표엔 없는 패턴,
          해석은 발화 자체에 있으므로 reasoning_origin=utterance 가 정답).
          conflict=true 는 VLM 관찰에 LED 횟수가 '있고' 그 값이 4/5와 다를 때만 기대.
          단 0.5fps 프레임으로는 깜빡임 횟수 관찰이 사실상 불가하므로,
          VLM 관찰에 LED 횟수가 없으면 conflict=false 가 정상이다."
    check: conflict_true
